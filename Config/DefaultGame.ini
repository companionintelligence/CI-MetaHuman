[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/Maps/CompanionStage")

; Epic's MetaHuman face-tracking and realtime-solver models never ship: nothing the game runs uses
; them, yet 909 MiB of them (three quarters of the cooked content) reached the Linux rehearsal
; package of 7f63003 although the map references none of them. The cook runs in the EDITOR, where
; every MetaHuman plugin is loaded, and two things there add them outside MapsToCook:
;   /MetaHumanCoreTech, 6 packages, 329 MiB: MetaHumanLiveLink's own Config/Game.ini adds
;     +DirectoriesToAlwaysCook=(Path="/MetaHumanCoreTech"), and CollectFilesToCook takes every
;     DirectoriesToAlwaysCook entry with no plugin or target filter.
;   /MetaHuman (MetaHuman Animator), 11 packages, 581 MiB: the plugin's editor classes
;     UMetaHumanIdentityPose and UMetaHumanPerformance load GenericTracker/GenericFaceContourTracker
;     and Solver/GenericFaceAnimationSolver in PostInitProperties, so the cooker takes both as
;     startup packages, and the tracker's soft references add its nine NNE models (FaceTracker,
;     which carries another machine's user-profile path, among them).
; Restricting or disabling the plugins in the .uproject does not stop either: the cook still
; loads them (MetaHumanCharacter requires MetaHuman, VibeMetaHumans requires both). Never-cook
; does: FRequestCluster::IsRequestCookable refuses a never-cook package whatever its instigator
; (always-cook directory, startup package or soft reference). The resident's Live Link face path
; is the LiveLink plugin plus /MetaHumanCharacter's ABP_MH_LiveLink and PA_MetaHuman_ARKit_Mapping,
; which import neither mount. On 5.5 neither mount exists, and an unmounted entry logs at Verbose.
; Each mount is listed BY ITS TOP-LEVEL FOLDERS: every asset in either is in one of them, none at
; its root. Naming a mount itself makes every editor start log a handled ensure, "Registered the
; path /MetaHuman/ for two different domains": AssetReferenceRestrictions (which GameFeatures
; pulls in) registers a domain for each content plugin's mount and one for each never-cook entry.
; An editor commandlet counts the ensure's error lines (26) and exits 1, so the cook would fail.
; A folder a later engine adds to either mount needs a line here, and the Linux release build's
; package gate finds one: build-linux-package.ps1 (release tooling outside this repository) runs
; utoc-report.py --match '^Engine/Plugins/MetaHuman/' on each .utoc it packaged, and stops a
; release build (a rehearsal warns) when anything is there and the resident is not a MetaHuman.
+DirectoriesToNeverCook=(Path="/MetaHuman/Exporter")
+DirectoriesToNeverCook=(Path="/MetaHuman/GenericTracker")
+DirectoriesToNeverCook=(Path="/MetaHuman/IdentityTemplate")
+DirectoriesToNeverCook=(Path="/MetaHuman/MeshFitting")
+DirectoriesToNeverCook=(Path="/MetaHuman/Solver")
+DirectoriesToNeverCook=(Path="/MetaHuman/Speech2Face")
+DirectoriesToNeverCook=(Path="/MetaHuman/TestData")
+DirectoriesToNeverCook=(Path="/MetaHumanCoreTech/GenericTracker")
+DirectoriesToNeverCook=(Path="/MetaHumanCoreTech/RealtimeMono")

; The HUD's brand font faces ship. They are loaded BY PATH at runtime: CIBrand::Detail::LoadFace
; (CICompanion, UI/CIBrandStyle.h) calls LoadObject on /Game/Fonts/Montserrat-Light, -Regular and
; -SemiBold, so no cooked package references them, the cook left Content/Fonts out and the
; packaged HUD fell back to Roboto. This needs the faces rooted when they load (#26): unrooted, a
; game's first garbage collection after the load frees them, and the next text the HUD shapes
; calls into a freed face. The game module stages the fonts' licence, OFL-Montserrat.txt.
+DirectoriesToAlwaysCook=(Path="/Game/Fonts")

; The 5.8-only plugins this project enables (MetaHuman*, the Toolsets/MCP set) pull in
; GameFeatures, and the cook then fails with TWO errors that name a type nobody here authored:
;   LogGameFeatures: Error: Asset manager settings do not include a rule for assets of type
;                    GameFeatureData, which is required for game feature plugins to function
;   LoadErrors: Error: ... Add entry to PrimaryAssetTypesToScan?
; The cook COMPLETES ("Finalisation: End / Done!", all 593 packages written) and then the
; commandlet exits 1 purely on the logged error count, which UAT reports as the far less
; informative Error_UnknownCookFailure(25). So the whole package fails on a missing config
; stanza, not on anything wrong with the content.
;
; This is the entry the editor's own "Add entry to PrimaryAssetTypesToScan?" prompt inserts.
; Directories points at an intentionally non-existent path: no project asset IS a
; GameFeatureData, the rule only has to EXIST so the asset manager stops treating the type as
; unknown. bIsEditorOnly keeps it out of the shipped build.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

