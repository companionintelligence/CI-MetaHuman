[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/Maps/CompanionStage")

; The 5.8-only plugins this project enables (MetaHuman*, the Toolsets/MCP set) pull in
; GameFeatures, and the cook then fails with TWO errors that name a type nobody here authored:
;   LogGameFeatures: Error: Asset manager settings do not include a rule for assets of type
;                    GameFeatureData, which is required for game feature plugins to function
;   LoadErrors: Error: ... Add entry to PrimaryAssetTypesToScan?
; The cook COMPLETES ("Finalisation: End / Done!", all 593 packages written) and then the
; commandlet exits 1 purely on the logged error count, which UAT reports as the far less
; informative Error_UnknownCookFailure(25). So the whole package fails on a missing config
; stanza, not on anything wrong with the content.
;
; This is the entry the editor's own "Add entry to PrimaryAssetTypesToScan?" prompt inserts.
; Directories points at an intentionally non-existent path: no project asset IS a
; GameFeatureData, the rule only has to EXIST so the asset manager stops treating the type as
; unknown. bIsEditorOnly keeps it out of the shipped build.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

