# Companion + face overlay: the configuration that turns the diorama into a virtual being.
#
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml -f docker-compose.ollama.yml \
#                  -f docker-compose.face.yml up -d project
#
services:
  project:
    image: ci/metahuman-local-llm:5.5-face
    environment:
      # Rig naming for the resident. CC = Reallusion Character Creator (Nia's V_* morphs);
      # ARKit = MetaHuman. The two share no curve names, so this is not cosmetic.
      MHLLM_FACE_PROFILE: "CC"

      # Viseme cycling. Leave OFF here: with it on, the mouth moves whether or not the LLM ever
      # replies, so it would mask exactly the failure this deployment is meant to expose.
      MHLLM_FACE_SELFTEST: "0"

      # Model choice is a LATENCY decision on this box, measured against the live Ollama:
      #   gemma3:1b   -> under 1s   (used here: conversation stays responsive)
      #   gemma4:e2b  -> ~12s warm, ~77s cold
      #   gemma4:latest (19.9GB) -> exceeded 60s even warm
      # e2b was the previously configured default and does work; it is simply too slow to feel
      # like a conversation. Raise this once a faster path (smaller quant, GPU offload) exists.
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:1b}"

      # Opening line, sent a few seconds after level load. It exists because there is still no
      # input path: without an unprompted first turn, a fully working build and a completely
      # broken one look identical. Set to "none" to disable.
      MHLLM_GREETING: "${MHLLM_GREETING:-Greet the visitor to your 1970s computer room in one short sentence.}"
