# Companion + face overlay: the configuration that turns the diorama into a virtual being.
#
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml -f docker-compose.ollama.yml \
#                  -f docker-compose.face.yml up -d project
#
services:
  project:
    image: ci/metahuman-local-llm:5.5-face
    environment:
      # Rig naming for the resident. CC = Reallusion Character Creator (Nia's V_* morphs);
      # ARKit = MetaHuman. The two share no curve names, so this is not cosmetic.
      MHLLM_FACE_PROFILE: "CC"

      # Viseme cycling. Leave OFF here: with it on, the mouth moves whether or not the LLM ever
      # replies, so it would mask exactly the failure this deployment is meant to expose.
      MHLLM_FACE_SELFTEST: "0"

      # Facial expression. UEmotionMapper reads the reply text and the face holds the result as a
      # sustained brow/cheek/eye bias COMPOSITED OVER the visemes -- it never competes with them for
      # the mouth. ON unless explicitly set to 0: an expressionless face is the regression, so the
      # kill switch is opt-OUT (unlike MHLLM_OPENING_SHOT, where a moving camera is the surprise).
      # Set to 0 to isolate a lip-sync problem from an expression problem in a capture.
      MHLLM_EMOTION: "${MHLLM_EMOTION:-1}"

      # Operator console. Hidden by default so the opening reads as a brand moment rather than a
      # settings screen; "/console" in the chat box toggles it at any time. Set to 1 to start it
      # open, which is what a kiosk operator (or a screenshot) wants.
      MHLLM_CONSOLE: "${MHLLM_CONSOLE:-0}"

      # Cognition runs on BETA-1, not this box. core-2 is a Strix Halo iGPU and the best it
      # manages is gemma4:e2b at ~12s per reply -- not a conversation. beta-1 has two discrete
      # Navi 31 GPUs (2x25.7GB, ROCm 6.4), and serves a 27B model in well under a second.
      #
      # Measured warm, one-line greeting, thinking disabled:
      #   qwen3.6:27b on beta-1   ->  814ms   (used here: 27B quality at conversational speed)
      #   qwen3:8b    on beta-1   ->  262ms   (if latency ever matters more than quality)
      #   gemma4:e2b  on core-2   ->  ~12s    (the old default; 77s cold)
      #
      # :11435 is an SSH tunnel to beta-1's Ollama, run as a --user systemd unit on core-2
      # (Deployment/core2/ollama-tunnel.service). beta-1's ollama.service declares
      # OLLAMA_HOST=0.0.0.0 but its running process predates that edit and is still bound to
      # 127.0.0.1; restarting it needs root on a box that serves other work, so this tunnels
      # instead. If that service is ever restarted, point straight at http://100.124.211.75:11434
      # and drop the tunnel.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11435}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.6:27b}"

      # The same beta-1 Ollama spelled for the OTHER backend, because this file did not pick one.
      # The base stack selects MHLLM_BACKEND=openai, which reads OPENAI_* and ignores the two lines
      # above entirely -- so `-f docker-compose.yml -f docker-compose.face.yml` set a 27B model on
      # beta-1 and then talked to whatever OPENAI_BASE_URL happened to be, which with no .env was
      # the C++ default of a local 127.0.0.1:11434. That is not hypothetical, and the size of the
      # gap is why it got noticed: Docs/audit-2026-08-16/README.md section 3 ("Verified working")
      # records an LLM median of 1324 ms on beta-1 against 31 155 ms from what it calls a run that
      # accidentally used the laptop's local Ollama -- a 24x difference, in that document's words.
      #
      # Pointing both at the same place fixes it without this file quietly choosing a backend for
      # the whole stack -- deciding that here is what would make `-f face` mean something different
      # from the base stack it is layered onto. Ollama serves its native /api/chat and its
      # OpenAI-compatible shim on one port: MetaHumanLLMSettings.h:70-74 names
      # "http://127.0.0.1:11434/v1" as the shim's base, and 127.0.0.1:11434 is the native default
      # at :53. So the two pairs describe one server and either backend reaches beta-1.
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://127.0.0.1:11435/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-qwen3.6:27b}"
      # Ollama's /v1 does not validate the bearer token, but a literal is carried rather than
      # nothing because UOpenAIChatClient guards the header on a non-empty key
      # (OpenAIChatClient.cpp:62) -- an empty value sends no Authorization header at all, which is
      # a different request shape from one carrying an ignored token.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-ollama}"

      # Chain-of-thought off. qwen3.6:27b answers in ~814ms without it and 16-21s with it, and
      # Ollama returns the reasoning in a separate field that never reaches the mouth.
      MHLLM_THINKING: "${MHLLM_THINKING:-0}"

      # Opening line, sent a few seconds after level load. It exists because there is still no
      # input path: without an unprompted first turn, a fully working build and a completely
      # broken one look identical. Set to "none" to disable.
      # The opening is now a SCRIPTED shot, not a generated greeting: the camera flies the hall,
      # settles behind her, she turns to the lens, and says this verbatim. A brand line has to be
      # identical every run and must not wait on a model round trip while the camera holds on her.
      MHLLM_GREETING: "${MHLLM_GREETING:-none}"
      MHLLM_OPENING_LINE: "${MHLLM_OPENING_LINE:-Welcome to Companion Intelligence, I'm Eliza. How can I help you?}"
      MHLLM_FLY_SECONDS: "${MHLLM_FLY_SECONDS:-11.0}"
      # Held before the move starts. Pixel Streaming clients take ~10s to negotiate, so with no
      # delay the opening plays to an empty room and every real visitor arrives after it.
      MHLLM_OPENING_DELAY: "${MHLLM_OPENING_DELAY:-3.0}"
      # Attract loop: replay the opening every N seconds while idle. 0 = once only. A live stream
      # has no other way to show its opening to someone who connects late.
      MHLLM_OPENING_REPLAY: "${MHLLM_OPENING_REPLAY:-0}"

      # The camera is STATIC unless the opening move is explicitly asked for. It used to be the
      # other way round, which meant the flythrough was what every run got whether or not anyone
      # wanted a moving camera, and the solved call framing needed an undocumented env var. Set
      # MHLLM_OPENING_SHOT=1 here to restore the eleven-second flythrough for a launch stream.
      MHLLM_OPENING_SHOT: "${MHLLM_OPENING_SHOT:-0}"

      # Free-look is opt-in for the same reason: with it on, the GameModeBase DefaultPawn turns
      # every mouse move into camera yaw/pitch, so any viewer of the stream can drag the shot off
      # the subject. Locked by default; MHLLM_FREE_LOOK=1 hands input back to the pawn.
      MHLLM_FREE_LOOK: "${MHLLM_FREE_LOOK:-0}"

      # She is Eliza -- named for the 1966 program, which is the right joke for a machine room of
      # this vintage. The persona has to agree with the scripted line or her first two sentences
      # will introduce two different characters.
      MHLLM_SYSTEM_PROMPT: "${MHLLM_SYSTEM_PROMPT:-You are Eliza, the resident intelligence of Companion Intelligence, speaking from a 1970s mainframe room. Warm, curious, concise. Reply in one or two short sentences.}"

      # --- Voice, via AMD Lemonade Server on beta-1 (ROCm), reached over the same SSH tunnel as
      # Ollama. Without KOKORO_SERVER_URL the character keeps its default UNullTextToSpeech and is
      # MUTE: the Pixel Streaming audio track still negotiates and goes live, and carries digital
      # silence forever. That is exactly what shipped until this was set, and it is invisible
      # unless you measure the track's actual energy rather than its existence.
      KOKORO_SERVER_URL: "${KOKORO_SERVER_URL:-http://127.0.0.1:13305}"
      KOKORO_MODEL: "${KOKORO_MODEL:-kokoro-v1}"
      # af_sky measured cleanest of the voices tried; change freely, it is per-request.
      # NOTE it is now used TWICE -- Lemonade synthesizes with it and the aligner below times
      # against it -- so changing it changes both. That is deliberate: Kokoro's style vector is
      # per-voice, so two voices give different durations for the same sentence, and an aligner
      # pointed at a different voice would return confidently precise timing for the wrong audio.
      KOKORO_VOICE: "${KOKORO_VOICE:-af_sky}"

      # --- Lip-sync alignment, via the kokoro-align sidecar on beta-1 (Deployment/kokoro-align).
      # KOKORO_SERVER_URL above gives us the audio and its true LENGTH; that only fixes the total.
      # The track underneath it is still estimated from spelling and then stretched to fit, so a
      # long word and a short one are given time in proportion to their letters rather than to how
      # long they were actually voiced. This service returns the per-phoneme durations Kokoro's own
      # duration predictor computed for the waveform -- the same tensor the length regulator used to
      # build it -- which the OpenAI /audio/speech schema discards at the HTTP boundary.
      #
      # :13400 is an SSH tunnel to beta-1, run as a --user systemd unit on core-2
      # (Deployment/core2/kokoro-align-tunnel.service), exactly like the Ollama one above.
      #
      # Unset it and speech is unaffected: the mouth silently drops back to the rescaled estimate,
      # and the log line says which of the two it used on every reply.
      KOKORO_ALIGNER_URL: "${KOKORO_ALIGNER_URL:-http://127.0.0.1:13400}"

      # STT for the future input path. Lemonade serves the OpenAI shape, NOT whisper.cpp's
      # /inference, hence the explicit path override.
      WHISPER_SERVER_URL: "${WHISPER_SERVER_URL:-http://127.0.0.1:13305}"
      WHISPER_ENDPOINT_PATH: "${WHISPER_ENDPOINT_PATH:-/api/v1/audio/transcriptions}"
      # Pinned here as well, because the same OpenAI shape that needs the path above also needs
      # the multipart `model` field: UWhisperSpeechToText::BuildMultipartFormData only writes that
      # part when the string is non-empty, and Docs/CONFIGURATION.md §4 records a blank one as a
      # 4xx on every transcription against Lemonade. whisper.cpp hosts one model and ignores the
      # field, so setting it costs that path nothing. This variable was in .env.example and in no
      # compose file at all until now, and its C++ default is the empty string
      # (MetaHumanLLMSettings.h:167) — so unset was the failing case, not a neutral one.
      WHISPER_MODEL: "${WHISPER_MODEL:-Whisper-Base}"
