# NVIDIA override — Vulkan rendering on NVIDIA, with the tested software VP8 stream fallback.
# Set PIXEL_STREAMING_ENCODER_CODEC=H264 only after NVENC has been verified from this image.
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up
#
# Use the default Dockerfile (Epic's runtime-pixel-streaming base bundles NVENC). The host needs
# NVIDIA Container Toolkit CDI support and a generated CDI spec; rootless Docker can keep that spec
# in ~/.config/cdi/nvidia.yaml without changing or restarting the daemon.

services:
  # Kokoro-with-alignment sidecar (kokoro-align/app.py). It is NOT on the host network and publishes
  # no port: it sits alone on its own bridge network (`kokoro-align`, at the bottom of this file) at
  # a fixed address. The host -- and so the host-networked `project` -- reaches it there; nothing
  # off this host can, and a TURN relay cannot either (coturn denies 10/8 and the other private
  # ranges). Inside its own network namespace it listens on 0.0.0.0, which there means only that
  # bridge. It used to share the host's network and listen on every interface the host has.
  #
  # Point the app at it with KOKORO_ALIGNER_URL=http://<KOKORO_ALIGN_IP>:13401 -- NOT 127.0.0.1,
  # which no longer reaches it.
  #
  # Deliberately not `internal: true`: the service fetches the Kokoro weights from Hugging Face and
  # misaki fetches its spaCy model on first use, so with no egress it would stay healthy-looking
  # (/health never loads the model) while every /speak failed. Baking both into
  # kokoro-align/Dockerfile is what would let this network go internal.
  kokoro-align:
    image: ci/kokoro-align:local
    build:
      context: ./kokoro-align
      dockerfile: Dockerfile
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "13401"]
    networks:
      kokoro-align:
        ipv4_address: "${KOKORO_ALIGN_IP:-10.213.13.2}"
    environment:
      # Optional shared token for /speak (app.py; /health stays open). The UE client
      # (KokoroPhonemeAligner.cpp) sends no Authorization header yet, so setting this today turns
      # alignment off for the app -- leave it blank until the client sends one.
      KOKORO_ALIGN_TOKEN: "${KOKORO_ALIGN_TOKEN:-}"
    restart: unless-stopped
    volumes:
      - kokoro-align-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:13401/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  project:
    depends_on:
      kokoro-align:
        condition: service_healthy
    command:
      - "-RenderOffscreen"
      - "-Vulkan"
      - "-ForceRes"
      - "-ResX=${STREAM_RES_X:-1280}"
      - "-ResY=${STREAM_RES_Y:-720}"
      - "-PixelStreamingUrl=${PIXEL_STREAMING_URL:-ws://127.0.0.1:8888}"
      - "-PixelStreamingEncoderCodec=${PIXEL_STREAMING_ENCODER_CODEC:-VP8}"
      - "-Unattended"
      - "-StdOut"
      - "-FullStdOutLogOutput"
    devices:
      - "nvidia.com/gpu=all"
    environment:
      VK_ICD_FILENAMES: "/etc/vulkan/icd.d/nvidia_icd.json"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      # Leave blank unless the kokoro-align sidecar is actually running on this host. The client
      # falls back to measured-duration text timing when unset; a dead hard-coded endpoint only
      # adds latency to every spoken turn. When it is running, it is at
      # http://<KOKORO_ALIGN_IP>:13401 (default 10.213.13.2), not on 127.0.0.1 -- see the service.
      KOKORO_ALIGNER_URL: "${KOKORO_ALIGNER_URL:-}"

volumes:
  kokoro-align-models:

networks:
  # The sidecar's own bridge, shared with nothing. A fixed subnet because `project` is on the host
  # network and cannot use Docker's service-name DNS: it needs an address it can be configured
  # with. Override KOKORO_ALIGN_SUBNET and KOKORO_ALIGN_IP together if this range is taken here.
  kokoro-align:
    driver: bridge
    ipam:
      config:
        - subnet: "${KOKORO_ALIGN_SUBNET:-10.213.13.0/29}"
