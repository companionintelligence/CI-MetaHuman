# coturn configuration for the Pixel Streaming relay: the `turnserver` service in
# docker-compose.yml. entrypoint.sh (beside this file) appends the values that must not be
# committed or that differ per host, then runs turnserver on the result. Nothing in this file is
# secret, and nothing secret may be added to it.

# 3478 serves STUN and TURN over UDP and TCP; 5349 serves TURN over TLS when entrypoint.sh finds a
# certificate (TURN_TLS_CERT_FILE / TURN_TLS_KEY_FILE). Without one it appends `no-tls`.
listening-port=3478
tls-listening-port=5349

# --- Authentication: time-limited credentials only ----------------------------------------------
# TURN REST API scheme, coturn's use-auth-secret. For every peer that connects, the signalling
# server mints a username that carries its own expiry and a credential that is an HMAC of that
# username under a secret shared with this server. coturn recomputes the HMAC, so there is no
# account store, and what a browser is handed stops opening new relays once it expires.
# static-auth-secret itself is appended by entrypoint.sh from TURN_STATIC_AUTH_SECRET.
#
# This replaces `-u TURN_USER:TURN_PASSWORD`: one static account whose password the signalling
# server wrote into the configuration of every browser that loaded the player page.
use-auth-secret
realm=ci-realm
fingerprint
# A nonce lives 10 minutes, so a captured request cannot be replayed for the life of the session.
stale-nonce=600

# --- Transport ----------------------------------------------------------------------------------
# Browsers cannot use TURN over DTLS. TLS 1.0 and 1.1 are refused when the TLS listener is on.
no-dtls
no-tlsv1
no-tlsv1_1
# WebRTC only ever asks for UDP relays (RFC 5766), even over a TCP or TLS connection to this server.
# TCP relays (RFC 6062) would let a credential holder open TCP connections to any peer this server
# is allowed to reach -- an HTTP service on this host's own address, for one.
no-tcp-relay

# --- Which peers a relay may reach --------------------------------------------------------------
# A TURN relay forwards to whatever address its client names. Without these lines, anyone holding a
# credential could use this host as a pivot into its loopback, its LAN, its Docker bridges and the
# rest of the tailnet. Every non-public range is denied below; entrypoint.sh then appends an
# `allowed-peer-ip` for each of this host's own addresses (every interface address but loopback and
# link-local, read when the container starts), because the host-networked Unreal streamer's
# candidates and coturn's own relays are on them -- behind NAT, private ones -- plus PUBLIC_IP and
# anything listed in TURN_ALLOWED_PEER_IPS. Single addresses, never their subnets. An address that
# is both denied and allowed is allowed, which is how coturn expresses "these ranges, except".
#
# Range syntax (first-last), not CIDR: it is the form coturn 4.6.2 parses.
no-multicast-peers
# IPv4: "this network", RFC 1918 private, CGNAT (the tailnet's 100.64/10), loopback, link-local,
# IETF protocol assignments, documentation and benchmarking blocks, the 6to4 relay anycast, and
# 240/4 (reserved, plus broadcast). Multicast is covered by no-multicast-peers.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6: loopback, IPv4-mapped (which would reach every IPv4 range above), NAT64, discard-only,
# IETF protocol assignments (Teredo), 6to4, unique-local (the tailnet's fd7a:115c:a1e0::/48 is in
# it) and link-local.
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- STUN amplification -------------------------------------------------------------------------
# This is also the stack's STUN server. Browsers need only XOR-MAPPED-ADDRESS; these three keep a
# spoofed binding request from earning a larger reply (coturn's own recommendation since 4.6.0).
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# --- Operation ----------------------------------------------------------------------------------
no-cli
log-file=stdout
verbose
