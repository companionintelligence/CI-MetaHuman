# coturn configuration for the Pixel Streaming relay: the `turnserver` service in
# docker-compose.yml. entrypoint.sh (beside this file) appends the values that must not be
# committed or that differ per host, then runs turnserver on the result. Nothing in this file is
# secret, and nothing secret may be added to it.

# 3478 serves both STUN and TURN, over UDP and TCP.
listening-port=3478

# --- Authentication: time-limited credentials only ----------------------------------------------
# TURN REST API scheme, coturn's use-auth-secret. For every peer that connects, the signalling
# server mints a username that carries its own expiry and a credential that is an HMAC of that
# username under a secret shared with this server. coturn recomputes the HMAC, so there is no
# account store, and what a browser is handed stops opening new relays once it expires.
# static-auth-secret itself is appended by entrypoint.sh from TURN_STATIC_AUTH_SECRET.
#
# This replaces `-u TURN_USER:TURN_PASSWORD`: one static account whose password the signalling
# server wrote into the configuration of every browser that loaded the player page.
use-auth-secret
realm=ci-realm
fingerprint
# A nonce lives 10 minutes, so a captured request cannot be replayed for the life of the session.
stale-nonce=600

# --- Transport ----------------------------------------------------------------------------------
# Browsers cannot use TURN over DTLS.
no-dtls
no-tls

# --- Operation ----------------------------------------------------------------------------------
no-cli
log-file=stdout
verbose
