# CI-portal OIDC gate for the Pixel Streaming player page.
# Secrets and environment-specific URLs are injected via OAUTH2_PROXY_* env vars in
# docker-compose.yml (client id/secret, issuer, redirect URL, cookie secret) — keep them
# out of this file so it is safe to commit.

# Use the generic OIDC provider (ci-portal exposes a standard OIDC discovery document).
provider = "oidc"

# Listen publicly; upstream to the signalling server's internal player HTTP port. The proxy
# forwards the player page AND its signalling WebSocket (WebSocket upgrades are proxied).
http_address = "0.0.0.0:8080"
upstreams = ["http://127.0.0.1:8090"]
reverse_proxy = true

# Any authenticated ci-portal user may access the stream. Tighten with `email_domains` (e.g.
# ["companionintelligence.com"]) or an allowed-groups claim check for least privilege.
email_domains = ["*"]

# Send users straight to ci-portal rather than showing oauth2-proxy's interstitial button.
skip_provider_button = true

# Cookie hardening. Set cookie_secure = true once the proxy is served over HTTPS (it must be
# for production — OIDC auth cookies over plain HTTP are unsafe).
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"

# Pass the authenticated identity to the upstream so the signalling server / player page can
# log or display who is connected.
pass_access_token = true
set_xauthrequest = true
