# CI-portal OIDC gate for the Pixel Streaming player page.
# Secrets and environment-specific values are injected via OAUTH2_PROXY_* env vars in
# docker-compose.yml (client id/secret, issuer, redirect URL, cookie secret, and the allowlist
# below) — keep them out of this file so it is safe to commit.

# Use the generic OIDC provider (ci-portal exposes a standard OIDC discovery document).
provider = "oidc"
code_challenge_method = "S256"
# CI Portal publishes its standard discovery document at `/api/auth/.well-known/...`, while
# the document's issuer remains the origin root. oauth2-proxy appends the discovery path to
# `oidc_issuer_url`, so configure the endpoints explicitly and retain issuer validation.
skip_oidc_discovery = true
# Start on CI Portal's sign-in page with oauth2-proxy's query intact. After the
# passkey/password sign-in, the page resumes /api/auth/oauth2/authorize from that
# query. Going straight to the API endpoint fails in the embedded Codex browser
# with `invalid_client: client_id is required`, even though the endpoint itself
# redirects correctly in a bare HTTP client.
login_url = "https://hub.ci.computer/login"
redeem_url = "https://hub.ci.computer/api/auth/oauth2/token"
profile_url = "https://hub.ci.computer/api/auth/oauth2/userinfo"
oidc_jwks_url = "https://hub.ci.computer/api/auth/jwks"

# Listen publicly; upstream to the signalling server's internal player HTTP port. The proxy
# forwards the player page AND its signalling WebSocket (WebSocket upgrades are proxied).
# Listen only on loopback. Tailscale Serve terminates HTTPS and forwards to this port.
http_address = "127.0.0.1:8095"
upstreams = ["http://127.0.0.1:8090"]
reverse_proxy = true

# WHO MAY WATCH -- deny by default. A CI Portal sign-in proves who someone is; it does not make
# them a viewer of this stream. Nothing in this file admits anyone: the allowlist comes from the
# environment (Deployment/.env, see .env.example), and with none configured every account is
# refused with a 403 after it signs in.
#
#   CI_PORTAL_ALLOWED_EMAILS_FILE    host file, one address per line, mounted at the path below
#   CI_PORTAL_ALLOWED_EMAIL_DOMAINS  -> OAUTH2_PROXY_EMAIL_DOMAINS (comma-separated)
#   CI_PORTAL_ALLOWED_GROUPS         -> OAUTH2_PROXY_ALLOWED_GROUPS (comma-separated)
#
# oauth2-proxy admits a user only when BOTH checks pass: the address is in the file or one of the
# domains, AND -- if any groups are set -- the user is in one of them. Groups therefore narrow an
# address allowlist rather than replace it; to admit by group alone, set
# CI_PORTAL_ALLOWED_EMAIL_DOMAINS=* together with CI_PORTAL_ALLOWED_GROUPS. `*` without groups is
# the open gate this replaced. Groups need the Portal to put a `groups` claim in the ID token
# (rename the claim with OAUTH2_PROXY_OIDC_GROUPS_CLAIM, or add a scope with OAUTH2_PROXY_SCOPE,
# in .env.edge).
#
# Do NOT add `email_domains` here. oauth2-proxy treats an EMPTY OAUTH2_PROXY_EMAIL_DOMAINS as
# unset and falls back to this file, so a value here would quietly become the default whenever
# the environment leaves the list blank.
authenticated_emails_file = "/etc/oauth2-proxy/allowed-emails.txt"

# Send users straight to ci-portal rather than showing oauth2-proxy's interstitial button.
skip_provider_button = true

# The browser reaches the proxy through Tailscale Serve over HTTPS, so auth cookies must be Secure.
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Pass the authenticated identity to the upstream so the signalling server / player page can
# log or display who is connected.
pass_access_token = true
set_xauthrequest = true
