# Containerized MetaHumanLocalLLM Pixel Streaming agent.
#
#   browser ──▶ oidc-proxy (:8095, CI-portal OIDC)  ──▶ signalling (:8090 player, :8888 streamer)
#                                                            ▲
#   coturn (:3478, WebRTC relay)  ◀── WebRTC media ──────────┤
#                                                            │
#   project (packaged UE app, GPU)  ── streamer ws ──────────┘
#                                  └── chat ──▶ CI-hub Ollama (OpenAI-compatible, via env)
#
# The Unreal app and coturn use host networking. The signalling server runs in bridge mode with
# its ports published on loopback only; the OIDC proxy is the only browser entry point.
# (:8095, not :8080 — :8080 is already in use on core-2 by the CI marketplace stack.)

# Connection logs. coturn, the signalling server and the OIDC gate log viewers' network addresses,
# and the gate the signed-in email address; the privacy policy keeps such logs 14 days at most.
# The "local" driver keeps each service's log with its container (5 files of 20 MB at most) on any
# host, whatever the daemon's default driver, so recreating the container deletes it, and with it
# the signalling server's own server-YYYY-MM-DD.log files, which live in the container too.
# systemd/ci-metahuman-log-purge@.timer recreates the three weekly (README.md, "Connection logs").
x-connection-logs: &connection-logs
  driver: "local"
  options:
    max-size: "20m"
    max-file: "5"

services:

  # WebRTC TURN relay. Needs TCP/UDP 3478 and the UDP relay range 49152-65535 reachable, plus TCP
  # 5349 when the TLS listener is on.
  # Configured by coturn/turnserver.conf; coturn/entrypoint.sh appends the shared secret at start.
  # There is no static account: the signalling server mints a time-limited username/credential
  # pair per connecting peer from the same TURN_STATIC_AUTH_SECRET (TURN REST API, coturn's
  # use-auth-secret), so nothing a browser is handed stays usable for long. With the secret unset
  # the entrypoint refuses to start rather than run an open relay.
  #
  # A relay may not reach loopback, link-local, private, CGNAT (tailnet) or multicast peers
  # (denied-peer-ip / no-multicast-peers in turnserver.conf), except this host's own addresses,
  # PUBLIC_IP and whatever TURN_ALLOWED_PEER_IPS adds. The host's addresses are where the
  # host-networked Unreal streamer's candidates and coturn's relays are; the entrypoint reads them
  # from /proc/net at start, so a NAT'd host's private interface address is covered too. Each is a
  # single address: the rest of the LAN, the tailnet and the Docker bridges stay denied.
  turnserver:
    image: "coturn/coturn:4.6.2"
    init: true
    network_mode: "host"
    logging: *connection-logs
    entrypoint: ["/bin/sh", "/etc/coturn/ci/entrypoint.sh"]
    command: []
    environment:
      TURN_STATIC_AUTH_SECRET: "${TURN_STATIC_AUTH_SECRET:-}"
      PUBLIC_IP: "${PUBLIC_IP:-}"
      TURN_ALLOWED_PEER_IPS: "${TURN_ALLOWED_PEER_IPS:-}"
    volumes:
      - "./coturn/turnserver.conf:/etc/coturn/ci/turnserver.conf:ro"
      - "./coturn/entrypoint.sh:/etc/coturn/ci/entrypoint.sh:ro"
      # TURN over TLS on 5349. Host paths from TURN_TLS_CERT_FILE / TURN_TLS_KEY_FILE (PEM; the key
      # readable by the container's nobody:nogroup). Unset, /dev/null stands in, reads as empty, and
      # the entrypoint runs without the TLS listener. Long syntax so that a mistyped path stops the
      # container instead of being created on the host as an empty directory.
      - type: "bind"
        source: "${TURN_TLS_CERT_FILE:-/dev/null}"
        target: "/etc/coturn/tls/cert.pem"
        read_only: true
      - type: "bind"
        source: "${TURN_TLS_KEY_FILE:-/dev/null}"
        target: "/etc/coturn/tls/key.pem"
        read_only: true

  # Pixel Streaming 5.8 signalling server built from Epic's pinned public source. Bind host ports
  # only to loopback: player HTTP on 8090 sits behind the OIDC proxy, and the UE app reaches the
  # streamer WebSocket on localhost:8888.
  signalling:
    image: "${SIGNALLING_IMAGE:-ci/pixelstreaming-signalling:ue5.8}"
    build:
      context: "."
      dockerfile: "Dockerfile.signalling"
      args:
        PIXEL_STREAMING_INFRASTRUCTURE_REF: "${PIXEL_STREAMING_INFRASTRUCTURE_REF:-289b9542159a6ee6a5d0f62834f1f27a472397b6}"
    init: true
    logging: *connection-logs
    entrypoint: ["bash", "/SignallingWebServer/SignallingWebServer/platform_scripts/bash/start.sh", "--nosudo"]
    command: []
    environment:
      PUBLIC_IP: "${PUBLIC_IP}"
      # STUN comes from this stack's own coturn, which answers binding requests on 3478 without
      # credentials. This used to be a public Google server, which told a third party the address of
      # every viewer and of this host and contradicted "nothing leaves the tailnet". A third-party
      # STUN server is now opt-in: EXTERNAL_STUN_SERVER, blank by default, is ADDED to this one.
      STUN_SERVER: "${PUBLIC_IP}:3478"
      EXTERNAL_STUN_SERVER: "${EXTERNAL_STUN_SERVER:-}"
      TURN_SERVER: "${PUBLIC_IP}:3478"
      # Advertised as turns:<this>?transport=tcp when set. A NAME and port, not an address: the
      # browser checks coturn's certificate against it. Leave blank unless TURN_TLS_CERT_FILE is set.
      TURN_TLS_SERVER: "${TURN_TLS_SERVER:-}"
      # No TURN username or password reaches this container. signalling-start.sh hands this shared
      # secret to the server through a 0600 file (--turn_secret_file), and the server mints a
      # username/credential pair for each peer as it connects, valid for TURN_CREDENTIAL_TTL
      # seconds for a player. The peer options it builds name the TURN server with no credentials.
      TURN_STATIC_AUTH_SECRET: "${TURN_STATIC_AUTH_SECRET:-}"
      TURN_CREDENTIAL_TTL: "${TURN_CREDENTIAL_TTL:-3600}"
    ports:
      - "127.0.0.1:8090:8090/tcp"
      - "127.0.0.1:8888:8888/tcp"
      - "127.0.0.1:8889:8889/tcp"
    volumes:
      - "./signalling-start.sh:/SignallingWebServer/SignallingWebServer/platform_scripts/bash/start.sh:ro"
      # The stock player page defaults to the LOCKED-MOUSE control scheme, which makes every click
      # over the stream arrive at a virtual cursor position instead of the point the viewer clicked
      # -- measured landing at (0,640) and (720,1280) for clicks at (300,1269) and (657,1269). That
      # The player fix is applied to Epic's pinned source and baked into the frontend at build
      # time, so it cannot silently disappear when a container is recreated.
    depends_on:
      - turnserver

  # CI-portal OIDC gate. Users authenticate against ci-portal before the player page or its
  # signalling WebSocket are reachable. The issuer/client/redirect come from .env and the two
  # secrets from .env.edge (never bake either in).
  oidc-proxy:
    image: "quay.io/oauth2-proxy/oauth2-proxy:v7.6.0"
    init: true
    network_mode: "host"
    logging: *connection-logs
    command: ["--config=/etc/oauth2-proxy.cfg"]
    volumes:
      - "./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro"
      # The address allowlist oauth2-proxy.cfg names in authenticated_emails_file: a host file, one
      # address per line, chosen by CI_PORTAL_ALLOWED_EMAILS_FILE. Unset, /dev/null stands in, which
      # reads as an empty list -- so the gate denies rather than failing to render. Long syntax on
      # purpose: a path that does not exist stops the container instead of being created as an
      # empty directory on the host.
      - type: "bind"
        source: "${CI_PORTAL_ALLOWED_EMAILS_FILE:-/dev/null}"
        target: "/etc/oauth2-proxy/allowed-emails.txt"
        read_only: true
    # The client secret and the cookie secret, and nothing else. They live in a SECOND file rather
    # than in `.env` because `.env` is handed to the `project` container whole (see the env_file
    # note on that service), and these two are wanted by this service alone.
    #
    # They keep oauth2-proxy's own OAUTH2_PROXY_* spelling inside the file, not the CI_PORTAL_* /
    # OIDC_COOKIE_SECRET names .env.example used for them: env_file injects a file's keys into the
    # container under those keys and cannot rename on the way. The container therefore sees the
    # same two variable names it saw when they were interpolated below -- same names, new route.
    #
    # For the same reason they must NOT be re-listed under `environment:`. An `environment:` entry
    # interpolating an unset variable renders as "" and an empty `environment:` value BEATS
    # env_file, so `OAUTH2_PROXY_CLIENT_SECRET: "${...}"` here would blank the value this file had
    # just supplied. (Both halves checked with `docker compose config`.)
    #
    # `required: false` because a clean checkout has no .env.edge either, and the stack still has
    # to render -- the login gate is the only part that needs this file.
    env_file:
      - path: ".env.edge"
        required: false
    environment:
      OAUTH2_PROXY_CLIENT_ID: "${CI_PORTAL_CLIENT_ID}"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${CI_PORTAL_ISSUER_URL}"
      OAUTH2_PROXY_REDIRECT_URL: "${CI_PORTAL_REDIRECT_URL}"
      # Who may watch. Both default to empty, and empty means nobody: oauth2-proxy.cfg sets no
      # email_domains, so with these blank and no allowed-emails file every sign-in gets a 403.
      # See oauth2-proxy.cfg for how the two combine (groups NARROW the address check).
      OAUTH2_PROXY_EMAIL_DOMAINS: "${CI_PORTAL_ALLOWED_EMAIL_DOMAINS:-}"
      OAUTH2_PROXY_ALLOWED_GROUPS: "${CI_PORTAL_ALLOWED_GROUPS:-}"
    depends_on:
      - signalling

  # The packaged UE app. Renders offscreen and streams via the signalling server, reading its
  # LLM/voice config from the environment (CI-hub Ollama, etc.). GPU access is intentionally
  # NOT specified here — layer a vendor override on top so one base file serves both fleets:
  #   AMD/core-2 (VAAPI):  docker compose -f docker-compose.yml -f docker-compose.amd.yml up
  #   NVIDIA (NVENC):      docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up
  # With no override it falls back to the software VP8 encoder (CPU, portable, slower).
  project:
    image: "ci/metahuman-local-llm:${UE_RELEASE}"
    build:
      context: ".."
      dockerfile: "${PROJECT_DOCKERFILE:-Deployment/Dockerfile}"
      args:
        RELEASE: "${UE_RELEASE}"
    init: true
    network_mode: "host"
    # `.env` is the file the README quickstart tells operators to create (`cp .env.example .env`),
    # and nothing handed it to THIS container: compose auto-loads `.env` for `${...}` interpolation
    # only, so a documented key that no environment: entry below happened to name by hand reached
    # nothing at all. Six app settings were in exactly that state — MHLLM_MAX_TURNS, MHLLM_MEMORY,
    # MHLLM_MEMORY_PATH, MHLLM_GAZE, MHLLM_CHAT_TIMEOUT, WHISPER_MODEL — documented in
    # .env.example, defaulted there, and delivered nowhere. (A seventh name, UE_RELEASE_SHORT, is
    # also delivered nowhere, but it has no reader anywhere in the repo either, so it is dead
    # rather than undelivered.) Handing the app the whole file is what
    # stops that list growing again: a key added to .env.example now arrives without a second edit
    # here, which is the failure mode enumeration has.
    #
    # `required: false` because a clean checkout has no `.env` (it is gitignored, .gitignore:24),
    # so without it `docker compose config` would fail outright rather than render. This is about
    # rendering the stack, not running it: core-2-runbook.md's deploy steps copy `.env.example` to
    # `.env` first, so no documented procedure actually brings the stack up without one.
    #
    # Because this hands over the WHOLE file, `.env` must not carry anything the app should not
    # see. The secrets other services want are dealt with two different ways, because they reach
    # their consumers two different ways:
    #
    #  * the two OIDC ones, CI_PORTAL_CLIENT_SECRET and OIDC_COOKIE_SECRET, were only ever read as
    #    oidc-proxy's container environment. They now live in `.env.edge`, which that service alone
    #    reads.
    #  * TURN_STATIC_AUTH_SECRET, from which turnserver and signalling derive time-limited TURN
    #    credentials, reaches both by INTERPOLATION into their `environment:` blocks, and compose
    #    interpolation reads the shell and the project env file ONLY — a service's env_file does
    #    not feed `${...}` (compose warns "variable is not set" and renders it blank; checked). The
    #    flags that would add a second interpolation source, `--env-file` and COMPOSE_ENV_FILES,
    #    both abort with "couldn't find env file" when a named file is absent, and a clean checkout
    #    has neither file; and giving both services `.env.edge` instead would hand them the OIDC
    #    secrets too. So it stays in `.env`, exactly as the static TURN_PASSWORD it replaced did.
    #
    # They are therefore all blanked for this service in `environment:` below. That is what keeps
    # the TURN secret out of the app, and it also covers the OIDC pair and the retired
    # TURN_PASSWORD for anyone whose `.env` was written before they moved.
    env_file:
      - path: ".env"
        required: false
    # Every INTERPOLATED key below is also in `.env`, deliberately (the four literal blanks below
    # are the exception -- three of them no longer exist in `.env` at all: the OIDC pair moved to
    # .env.edge.example and TURN_PASSWORD was retired).
    # env_file reads the FILE and nothing else, so
    # a key delivered only that way ignores the process environment entirely and
    # `VAR=x docker compose up` silently does nothing for it. What is kept here is the set a
    # one-off run actually flips — backend, hub endpoint/token/model, the two voice URLs, persona —
    # because an interpolated environment: entry outranks the same key coming from env_file, so the
    # shell still wins for these. The habit is in this repo's own instructions: README.md and
    # core-2-runbook.md both write the build step as `PROJECT_DOCKERFILE=… docker compose …`.
    environment:
      # Blanked on purpose, and an empty value is the form that works. A valueless
      # `TURN_PASSWORD:` entry does NOT remove it here -- but only because this env_file happens to
      # be `.env`, which compose also reads as its own project env file: with the same entry against
      # an env_file named anything else, a valueless key renders `null`. So this is a property of
      # this file's setup rather than a general env_file-vs-environment rule; both forms were
      # checked with `docker compose config`. An explicit `""` is unambiguous either way.
      # Nothing in Plugins/CICompanion/Source reads any of these four names -- grepped across the
      # whole repo, zero code hits -- so blanking them costs the app nothing.
      CI_PORTAL_CLIENT_SECRET: ""
      OIDC_COOKIE_SECRET: ""
      TURN_PASSWORD: ""
      TURN_STATIC_AUTH_SECRET: ""

      # `openai` selects UOpenAIChatClient, aimed at CI_HUB_URL below — the OpenAI-shaped path,
      # which is what the CI side of this deployment speaks. See the CI_HUB_URL block for what
      # that URL actually points at.
      #
      # The default is spelled out here rather than left to the file, because .env.example ships a
      # value for this key: with a bare "${MHLLM_BACKEND}" the quickstart's `cp .env.example .env`
      # would decide the protocol, and README.md's quickstart never mentions MHLLM_BACKEND at all,
      # so nobody following it would know a copied file had moved the base stack onto the native
      # Ollama client. The `:-` also covers a missing or blank `.env`.
      #
      # docker-compose.ollama.yml pins the literal "ollama" and still wins — an override file's
      # value replaces this one, not the other way round (checked with `docker compose config` on
      # the merged pair, with a `.env` copied from .env.example).
      MHLLM_BACKEND: "${MHLLM_BACKEND:-openai}"

      # --- CI hub inference ---
      # CI_HUB_URL is the OpenAI-compatible base URL up to and INCLUDING the version segment;
      # UOpenAIChatClient appends "/chat/completions" to it (OpenAIChatClient.cpp, BuildRequestBody).
      #
      # The default is NOT the Hub's own address, and that is the correction. The Hub does not
      # proxy inference — its inference controller says so itself ("The Hub does NOT proxy
      # inference requests. Apps talk to the Ollama container ... directly", CI-Hub
      # packages/backend/src/modules/inference/inference.controller.ts) and this repo's
      # Docs/COMPAT-AND-ECOSYSTEM-REVIEW.md §3 reached the same conclusion by enumerating all 190
      # paths in the Hub's swagger.json and finding no /v1, no *chat*, no *completions*. Grepping
      # that checkout's packages/backend/src for a `chat/completions` route or any `v1/…` route
      # declaration returns nothing, which is the same answer from a third direction.
      #
      # An `/api/inference/v1` base does appear in
      # CI-Server/docs/architecture/hub-inference-integration.md §2, and it is easy to mistake for
      # current: that document is headed "Status: Design / proposal", and its §7 lists two hard
      # prerequisites in CI-Hub that block it today. It describes a contract to build, not one to
      # configure against.
      #
      # What the Hub actually distributes, over GET /api/inference/apps/<slug>/credentials(.env),
      # is the backend's OWN OpenAI base — `${ollamaBaseUrl}/v1`, where ollamaBaseUrl resolves to
      # host.docker.internal / 172.17.0.1 / localhost on :11434 (inference/backends/ollama.backend.ts).
      # The project container uses host networking, so on a box that also runs the Hub's Ollama that
      # is the loopback address below. Point it elsewhere if Ollama is on another host.
      #
      # Note that CI-MetaHuman cannot fetch those credentials itself: the Hub's APP_ENV_KEYS table
      # registers `hermes-agent` and `openclaw` and nothing else, so there is no slug for this app
      # to ask under. Until one exists, this value is set by hand.
      CI_HUB_URL: "${CI_HUB_URL:-http://127.0.0.1:11434/v1}"
      CI_HUB_TOKEN: "${CI_HUB_TOKEN}"
      CI_HUB_MODEL: "${CI_HUB_MODEL}"
      # The same three values under the vendor-neutral names, so the mapping is visible in the
      # manifest instead of only in C++. FMetaHumanLLMEnvConfig::Apply already assigns CI_HUB_URL
      # to OpenAIBaseUrl, CI_HUB_TOKEN to OpenAIApiKey and CI_HUB_MODEL to OpenAIModel, then
      # applies OPENAI_* afterwards — so an explicit OPENAI_* wins, and pointing this stack at a
      # non-CI OpenAI-compatible server (LM Studio, vLLM, llama.cpp, Lemonade) is these three
      # variables and nothing else. Set to the CI_HUB_* value when unset, so they agree by
      # construction and cannot drift into two different endpoints.
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-${CI_HUB_URL:-http://127.0.0.1:11434/v1}}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-${CI_HUB_TOKEN}}"
      OPENAI_MODEL: "${OPENAI_MODEL:-${CI_HUB_MODEL}}"

      # Optional audio path. The app emits a live WebRTC audio track even when TTS is unset,
      # so a connected browser alone does not verify that the resident can speak.
      KOKORO_SERVER_URL: "${KOKORO_SERVER_URL:-}"
      KOKORO_MODEL: "${KOKORO_MODEL:-}"
      KOKORO_VOICE: "${KOKORO_VOICE:-af_sky}"
      KOKORO_ALIGNER_URL: "${KOKORO_ALIGNER_URL:-}"

      WHISPER_SERVER_URL: "${WHISPER_SERVER_URL}"
      PIPER_SERVER_URL: "${PIPER_SERVER_URL}"
      MHLLM_SYSTEM_PROMPT: "${MHLLM_SYSTEM_PROMPT}"
    command:
      - "-RenderOffscreen"
      - "-Vulkan"
      - "-ForceRes"
      - "-ResX=${STREAM_RES_X:-1280}"
      - "-ResY=${STREAM_RES_Y:-720}"
      - "-PixelStreamingUrl=${PIXEL_STREAMING_URL:-ws://127.0.0.1:8888}"
      - "-PixelStreamingEncoderCodec=${PIXEL_STREAMING_ENCODER_CODEC:-VP8}"
      - "-Unattended"
      - "-StdOut"
      - "-FullStdOutLogOutput"
    depends_on:
      - signalling
