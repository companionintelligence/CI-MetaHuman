# Direct-Ollama override — point the agent at a local Ollama (native /api/chat), no auth.
#
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml -f docker-compose.ollama.yml \
#     up -d project signalling turnserver      # note: oidc-proxy omitted = no login gate
#
# Use this for a tailnet-only smoke test where the agent talks straight to the Ollama that
# CI-Hub already runs on the host (127.0.0.1:11434, no token). Overrides the base file's
# MHLLM_BACKEND=openai. Model defaults to gemma4:e2b (gemma4:4b is not in the public Ollama
# registry; e2b/31b are the host's installed gemma4 tags) — override with OLLAMA_MODEL.

services:
  project:
    environment:
      # A LITERAL, not "${MHLLM_BACKEND:-ollama}", and that is the whole point of this line. The
      # base file now carries `${MHLLM_BACKEND:-openai}` and hands the app `.env` wholesale via
      # env_file, so the backend could otherwise be decided by whatever an operator's `.env` says.
      # A literal in a later -f file replaces the base value outright and outranks env_file, so
      # naming this override on the command line is what selects Ollama — nothing else has to
      # agree with it.
      MHLLM_BACKEND: "ollama"
      # These two stay interpolated: a smoke test wants `OLLAMA_MODEL=x docker compose … up`. Note
      # the fallbacks only apply when the variable is unset or EMPTY, and compose reads `.env` for
      # interpolation too — so a filled-in OLLAMA_BASE_URL in `.env` silently replaces the default
      # below. .env.example ships both blank for that reason.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:e2b}"

  # Run the stock image entrypoint (bash .../start.sh --nosudo), but mount a patched start.sh
  # over the stock path: --https_redirect removed (it binds taken port 80) + explicit ports.
  # setup's npm install/link/build stays stock, so it builds and runs correctly on :8090.
  signalling:
    entrypoint: ["bash", "/SignallingWebServer/platform_scripts/bash/start.sh", "--nosudo"]
    command: []
    environment:
      PUBLIC_IP: "${PUBLIC_IP:-127.0.0.1}"
    volumes:
      - "./signalling-start.sh:/SignallingWebServer/platform_scripts/bash/start.sh:ro"
