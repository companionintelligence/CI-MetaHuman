# AMD / Strix Halo override — VAAPI hardware encode via /dev/dri.
#
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml up
#
# Measured on core-2 (AMD Ryzen AI Max+ 395, Radeon 8060S, RADV/Mesa 26): Vulkan renders and
# VAAPI exposes H.264 (Baseline/Main/High), HEVC, and AV1 encode on /dev/dri/renderD128.
# WebRTC uses H.264, so we select the VAAPI H.264 encoder here rather than NVENC.
#
# Prereq on the host: the packaged app must be an AMD-runtime image (Mesa + Vulkan + VAAPI),
# so point the build at Dockerfile.amd:  PROJECT_DOCKERFILE=Deployment/Dockerfile.amd

services:
  project:
    # Pass the AMD render node into the container; group_add gives access to the
    # render/video device groups that own /dev/dri/renderD128 and card1.
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      # Numeric host GIDs that own /dev/dri — the group NAMES ("render"/"video") may not
      # exist inside the container, so pass GIDs. Defaults are core-2's; override
      # RENDER_GID / VIDEO_GID (getent group render video) for a different host.
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    environment:
      # AMD VAAPI driver for the video encoder.
      LIBVA_DRIVER_NAME: "radeonsi"
      # AMD RADV hardware Vulkan ICD (exact filename is radeon_icd.json on Mesa 26).
      VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/radeon_icd.json"
      # ACO+SM5 still SIGABRT's in the SkyLight cubemap capture on Strix Halo. Under SM5 the
      # LLVM backend has no mesh-shader gate (that only blocked it under SM6), so it can init
      # the RHI AND uses different codegen that may dodge the ACO crash. Last software lever.
      RADV_DEBUG: "${RADV_DEBUG:-}"
      # Some Vulkan/offscreen paths want a runtime dir; silence the warning and give one.
      XDG_RUNTIME_DIR: "/tmp"
    command:
      - "-RenderOffscreen"
      - "-Vulkan"
      # RADV on the Strix Halo iGPU crashes in hardware ray tracing (Lumen HWRT / RT dynamic
      # geometry) — disable RT and force software Lumen off; a talking-head avatar needs
      # neither, and this keeps the GPU stable.
      - "-noraytracing"
      - "-ExecCmds=r.RayTracing 0; r.Lumen.HardwareRayTracing 0; r.DynamicGlobalIlluminationMethod 0; r.ReflectionMethod 0; r.SkyLight.RealTimeReflectionCapture 0; r.SkyAtmosphere 0; r.ReflectionCaptureResolution 0; r.Vulkan.WaitForIdleOnSubmit 2; r.GenerateMeshDistanceFields 0; r.Nanite 0"
      # -ForceRes IS REQUIRED, and its previous absence meant the composed shot never shipped.
      #
      # The old comment here said "portrait 9:16 by default" and left -ForceRes off so the
      # frontend's MatchViewportRes could resize the render. Measured on the live stream
      # 2026-08-06, that is not what happened: WITHOUT -ForceRes the -ResX/-ResY values are only a
      # hint, and UE under -RenderOffscreen falls back to its own 1280x720. Every viewer who has
      # ever opened :8090 got a LANDSCAPE crop of a shot composed for 9:16 -- the subject small and
      # centred, the cabinet tops cutting a hard horizontal band across her waist. Nobody chose
      # that framing; it was a default nobody knew was winning.
      #
      # Pinning it costs the MatchViewportRes resize, and that is the right trade for this product.
      # The thing being served is a video CALL. A call app does not stretch the call to fill a 21:9
      # monitor -- it letterboxes a portrait frame, which is exactly what a pinned backbuffer gives
      # in a wide window. Adaptivity was buying a worse picture on every window shape but one.
      #
      # AspectRatioAxisConstraint=AspectRatio_MaintainYFOV in DefaultEngine.ini still governs the
      # crop, and its consequence is worth stating because it has cost several framing attempts:
      # vertical coverage is held, so HORIZONTAL coverage is always aspect x vertical. At 9:16 that
      # is 0.5625x. Measured against the authored set (Nia stature 193cm, eyeline 180cm, camera at
      # 160cm) the frame covers ~85cm vertically, hence only ~48cm horizontally -- narrower than
      # her shoulders. "Head to hips WITH the aisle past both shoulders" is therefore not a framing
      # that exists at any distance in 9:16: ~120cm of horizontal needs ~213cm of vertical, which
      # is head-to-knees. Pick one before touching CAM_DIST in author_diorama.py.
      #
      # For a genuinely landscape display, override both together:
      #   STREAM_RES_X=1280 STREAM_RES_Y=720 docker compose ... up -d project
      - "-ForceRes"
      - "-ResX=${STREAM_RES_X:-720}"
      - "-ResY=${STREAM_RES_Y:-1280}"
      # Lets the browser send the resize command that MatchViewportRes relies on.
      - "-AllowPixelStreamingCommands=true"
      - "-PixelStreamingUrl=ws://127.0.0.1:8888"
      # NVENC isn't present on an AMD host, so PixelStreaming falls back to VP8 software
      # encode anyway; select VP8 directly to skip the failing NVENC probe.
      - "-PixelStreamingEncoderCodec=VP8"
      - "-Unattended"
      - "-StdOut"
      - "-FullStdOutLogOutput"
